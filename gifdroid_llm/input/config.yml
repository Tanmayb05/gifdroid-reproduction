# CLI (run with this config):
# .venv/bin/python -m gifdroid_llm.main --config gifdroid_llm/input/config.yml --env-file .env.local
# .venv/bin/python -m gifdroid_llm.main --config gifdroid_llm/input/config.yml --env-file .env.local --dry-run
#
# This is an example configuration file for the GifDroid LLM pipeline.
# It demonstrates the multi-run format, which allows you to process
# multiple videos in a single execution.

# Shared settings are applied to all runs defined in the 'runs' list.
# You can also define these settings at the top level for a single-run configuration.

# -----------------
# Shared Settings
# -----------------

# LLM provider configuration
# Supported providers: "gemini", "openai", "claude"
llm: "gemini"
# Optional: specify a particular model. If not provided, a default is used.
# e.g., "gemini-1.5-flash", "gpt-4o", "claude-3-opus-20240229"
llm_model: "gemini-2.5-flash"

# Frame sampling configuration
# Defines how frames are extracted from the input video.
frame_sampling:
  # Strategy for selecting frames.
  # "uniform": Selects frames at a fixed rate (fps).
  # "adaptive": (Not yet implemented) A more advanced strategy.
  strategy: "uniform"

  # Frames per second to sample from the video.
  fps: 1.5

  # Maximum number of frames to extract.
  max_frames: 100

# Keyframe selection configuration
# Defines the method for choosing the most significant frames.
keyframe_selection:
  # Method for selecting keyframes.
  # "heuristic": Uses a simple time-based gap to select frames.
  # "llm_assisted": (Not yet implemented) Uses the LLM to select frames.
  method: "llm_assisted"

  # The minimum time gap (in seconds) between selected keyframes.
  min_gap_seconds: 1.0

# Output configuration
output:
  # If true, overwrite existing output files. If false, skip processing
  # if the output file already exists.
  overwrite: true

# Logging configuration
logging:
  # Logging level for the application.
  # Supported levels: "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"
  level: "INFO"

# -----------------
# Run Definitions
# -----------------

# A list of video processing runs. Each entry in the list will be
# processed sequentially using the shared settings defined above.
runs:
  - app_name: "AdAway"
    utg_number: [01, 02, 03, 01, 02, 03]
    video_path:
      - "apps/adaway/videos/handheld/hhv-001.mp4"
      - "apps/adaway/videos/handheld/hhv-001.mp4"
      - "apps/adaway/videos/handheld/hhv-001.mp4"
      - "apps/adaway/videos/screenrec/srv-001.mp4"
      - "apps/adaway/videos/screenrec/srv-001.mp4"
      - "apps/adaway/videos/screenrec/srv-001.mp4"


  # - app_name: "AntennaPod"
  #   utg_number: [2, 3]
  #   video_path: "apps/antennapod/videos/antennapod_utg02.mp4"
