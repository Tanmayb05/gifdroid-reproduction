# CLI:
# .venv/bin/python -m gifdroid_llm.main --config gifdroid_llm/input/config.yml --env-file .env.local

# llm: "llama"
# llm_model: "llama3.2-vision"
llm: "llava"
# llm_model: "qwen2.5vl:7b"
llama_action_prompt_file: "gifdroid_llm/input/prompts/llama_action_prompt_gemini_2.txt"

frame_sampling:
  strategy: "uniform"
  fps: 1.5
  max_frames: 100

keyframe_selection:
  # Options: "heuristic", "llm_assisted", "ssim"
  method: "llm_assisted"
  min_gap_seconds: 1.0
  ssim_threshold: 0.95
  stable_threshold: 2

output:
  overwrite: true

logging:
  level: "INFO"

runs:
  - app_name: "adaway"
    video_path:
      - "hhv"
      - "srv"

  - app_name: "antennapod"
    video_path:
      - "hhv"
      - "srv"

