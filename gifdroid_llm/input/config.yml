# CLI (run with this config):
# .venv/bin/python -m gifdroid_llm.main --config gifdroid_llm/input/config.yml --env-file .env.local
# .venv/bin/python -m gifdroid_llm.main --config gifdroid_llm/input/config.yml --env-file .env.local --dry-run

# -----------------
# Shared Settings
# -----------------

llm: "llama"
llm_model: "llama3.2-vision"

frame_sampling:
  strategy: "uniform"
  fps: 1.5
  max_frames: 100

keyframe_selection:
  method: "llm_assisted"
  min_gap_seconds: 1.0

output:
  overwrite: true

logging:
  level: "INFO"

# -----------------
# Run Definitions
# -----------------

runs:
  - app_name: "AdAway"
    video_path:
      - "apps/adaway/videos/handheld/hhv-001.mp4"
      - "apps/adaway/videos/screenrec/srv-001.mp4"

  # - app_name: "AntennaPod"
  #   video_path: "apps/antennapod/videos/handheld/hhv-001.mp4"
