runs:
  - app_name: "AntennaPod"
    utg_number: "01"
    video_path: "hhv"

llm: "gemini"
llm_model: "gemini-2.5-flash"

frame_sampling:
  strategy: "uniform"
  fps: 1.5
  max_frames: 100

keyframe_selection:
  method: "llm_assisted"
  min_gap_seconds: 1.0

output:
  overwrite: true

logging:
  level: "INFO"
