# This is an example configuration file for the GifDroid LLM pipeline.

# -----------------
# Shared Settings
# -----------------

# LLM provider configuration
# Supported providers: "gemini", "llama", "qwen", "sonnet"/"claude"
llm: "gemini"
# Optional: specify a particular model. If not provided, a default is used.
# e.g., "gemini-2.5-flash", "llama3.2-vision:latest", "qwen2.5-vl-72b-instruct"
llm_model: "gemini-2.5-flash"

frame_sampling:
  # "uniform": fixed rate (fps). "adaptive": not yet implemented.
  strategy: "uniform"
  fps: 1.0
  max_frames: 100

keyframe_selection:
  # "heuristic": motion-threshold based.
  # "llm_assisted": currently same behavior as heuristic.
  # "ssim": GIFdroid-style stable-screen detection via consecutive-frame SSIM.
  method: "heuristic"
  min_gap_seconds: 2.0
  # Used only by method="ssim"
  ssim_threshold: 0.95
  stable_threshold: 2

output:
  # If false, skip runs where execution_trace.json already exists.
  overwrite: false

logging:
  level: "INFO"

# -----------------
# Run Definitions
# -----------------

# Available app_name values (from apps/):
# - "adaway"
# - "antennapod"
# - "homemedkit"
# - "jigsaw"
# - "luxalarm"
# - "portauthority"
# - "simplenotes"
# - "wifianalyzer"
#
# video_path can be:
# - a shorthand: "hhv" or "srv" (resolves to apps/{app}/videos/handheld/hhv-001.mp4 etc.)
# - an explicit path: "apps/adaway/videos/handheld/hhv-001.mp4"
# - a list of paths/shorthands to run multiple videos in one go

runs:
  - app_name: "AdAway"
    video_path:
      - "apps/adaway/videos/handheld/hhv-001.mp4"
      - "apps/adaway/videos/screenrec/srv-001.mp4"

  - app_name: "AntennaPod"
    video_path: "apps/antennapod/videos/handheld/hhv-001.mp4"
