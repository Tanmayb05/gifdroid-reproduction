#   homeraudioplayer, jigsaw, luxalarm, newpipe, pantry, portauthority,
#   quitter, simplenotes, vanilla, wifianalyzer

# video_path formats supported:
#   - "srv" / "hhv"           → defaults to srv-001.mp4 / hhv-001.mp4
#   - "srv-001.mp4"           → exact file
#   - "srv-*" / "hhv-*"       → all matching numbered videos (globbed, sorted)
#   - Explicit path           → "apps/adaway/videos/srv-001.mp4"

