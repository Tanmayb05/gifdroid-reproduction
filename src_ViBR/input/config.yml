# -----------------
# LLM Configuration
# -----------------

# LLM Provider options: "openai", "gemini"
llm: "gemini"

# Model selection
# OpenAI:  gpt-4o, gpt-4o-mini, gpt-4-turbo
# Gemini:  gemini-2.5-pro, gemini-2.5-flash, gemini-1.5-flash
llm_model: "gemini-2.5-pro"

# -----------------
# Algorithm Selection
# -----------------

# Default algorithm for all runs
# Options: "clip" (CLIP-based visual similarity), "ssim" (Structure Similarity Index)
algorithm: "clip"

# -----------------
# Output & Logging
# -----------------

output:
  # If false, skip runs where output already exists.
  # If true, overwrite existing output.
  overwrite: true

logging:
  # One of: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"

# -----------------
# Run Definitions
# -----------------

# All available apps in the gifdroid-reproduction dataset:
#   adaway, antennapod, bakerspercentagecalculator, batterytemperaturedisplay,
