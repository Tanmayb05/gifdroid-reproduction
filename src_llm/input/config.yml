# CLI:
# .venv/bin/python -m src_llm.main --config src_llm/input/config.yml --env-file .env.local

# -----------------
# LLM Configuration
# -----------------

# Provider options: "qwen", "llama", "gemma", "llava", "minicpm", "gemini"
llm: "gemini"
llm_model: "gemini-2.5-pro"

# video_mode: when true, skips keyframe pipeline and sends video directly to the provider.
# Currently only supported by llm: "gemini" via Vertex AI File API.
video_mode: true

# Prompt file for LLM action inference
# Options:
#   - "src_llm/input/prompts/llama_action_prompt_baseline_2.txt"
#   - "src_llm/input/prompts/llama_action_prompt_memory.txt"
#   - "src_llm/input/prompts/llama_action_prompt_gemini_2.txt"
#   - "src_llm/input/prompts/llama_action_prompt_claude.txt"
llm_prompt_file: "src_llm/input/prompts/llama_action_prompt_memory.txt"

# -----------------
# Frame Sampling (ignored in video_mode)
# -----------------

frame_sampling:
  strategy: "uniform"
  fps: 1.5
  max_frames: 100

# -----------------
# Keyframe Selection (ignored in video_mode)
# -----------------

keyframe_selection:
  # Options: "heuristic", "llm_assisted", "ssim"
  # NOTE: These settings are ignored when video_mode: true
  method: "ssim"
  min_gap_seconds: 1.0
  ssim_threshold: 0.95
  stable_threshold: 2

# -----------------
# Output & Logging
# -----------------

output:
  overwrite: true

logging:
  level: "INFO"

# -----------------
# Run Definitions
# -----------------

